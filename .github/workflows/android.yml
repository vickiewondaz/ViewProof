name: Android release

# Every push to main rebuilds the native shell around the live PWA
# (Capacitor loads https://viewproof.netlify.app, so web changes need no
# resubmission — this rebuilds only when native files/version change, but
# runs every push so the artifact is never stale).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "17"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ubuntu runners already ship the Android SDK (ANDROID_SDK_ROOT).
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Web deps + Capacitor sync
        run: |
          npm ci --legacy-peer-deps
          npx cap sync android

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
          ls -la android/app/release.keystore

      - name: Version from package.json + run number
        id: ver
        run: |
          V=$(node -p "require('./package.json').version")
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build signed APK + AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_VERSION_CODE: ${{ steps.ver.outputs.code }}
          ANDROID_VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          chmod +x gradlew
          test -f "$ANDROID_KEYSTORE_FILE" || { echo "keystore missing"; exit 1; }
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || { echo "keystore password secret empty"; exit 1; }
          echo "version=${ANDROID_VERSION_NAME} code=${ANDROID_VERSION_CODE} alias=${ANDROID_KEY_ALIAS}"
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/ViewProof-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}.apk
          cp android/app/build/outputs/bundle/release/app-release.aab dist/ViewProof-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}.aab
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: viewproof-android
          path: dist/

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}
          name: ViewProof Android v${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.code }})
          body: |
            Production Android build around https://viewproof.netlify.app.
            - `ViewProof-*.apk` — install directly on any Android phone.
            - `ViewProof-*.aab` — upload to Play Console.
            Signed with the ViewProof release key (same key every build — required for updates).
          files: dist/*
